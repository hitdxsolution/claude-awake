  <rect width="256" height="256" rx="56" fill="#D97757"/>
  <circle cx="118" cy="132" r="70" fill="#FFFFFF"/>
  <circle cx="152" cy="96" r="68" fill="#D97757"/>
  <line x1="54" y1="202" x2="202" y2="54" stroke="#D97757" stroke-width="48" stroke-linecap="round"/>
  <line x1="54" y1="202" x2="202" y2="54" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
</svg>
